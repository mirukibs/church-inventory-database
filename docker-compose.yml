services:
  db:
    image: postgres:16
    container_name: church_inventory_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_password}
      POSTGRES_DB: ${POSTGRES_DB:-church_inventory}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
